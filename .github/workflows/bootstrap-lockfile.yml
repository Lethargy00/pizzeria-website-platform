name: bootstrap-lockfile
# Agent sessions can't reach the npm registry (docs/DECISIONS.md #79), so the lockfile
# is (re)generated here whenever it is missing or out of date with the package.json files.
# Installs with --ignore-scripts, applies Prettier, commits to main, then dispatches ci and
# security (pushes made with GITHUB_TOKEN don't trigger workflows; dispatches do).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', 'packages/*/package.json', 'playground/package.json', 'pnpm-workspace.yaml', '.npmrc']
permissions:
  contents: read
concurrency:
  group: bootstrap-lockfile
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - id: check
        run: |
          if [ -f pnpm-lock.yaml ] && pnpm install --frozen-lockfile --lockfile-only --ignore-scripts >/dev/null 2>&1; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      # Errors are re-emitted as annotations so agents can read them via the check-runs API.
      - if: steps.check.outputs.stale == 'true'
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts 2>&1 | tee install.log || { tail -n 25 install.log | sed 's/^/::error title=pnpm install::/'; exit 1; }
          pnpm format 2>&1 | tee format.log || { tail -n 25 format.log | sed 's/^/::error title=prettier::/'; exit 1; }
          rm -f install.log format.log
      - if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: regenerate pnpm-lock.yaml and apply prettier" -m "Agent: bootstrap-lockfile workflow"
          git push
          gh workflow run ci.yml --ref main
          gh workflow run security.yml --ref main
