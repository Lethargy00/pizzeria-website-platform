name: bootstrap-lockfile
# Agent sessions can't reach the npm registry (docs/DECISIONS.md #79), so the lockfile
# is (re)generated here whenever it is missing or out of date with the package.json files.
#
# Two jobs, so that no dependency code ever runs next to a write token (#129):
#   generate  contents: read, no persisted credentials. Runs pnpm install --ignore-scripts and
#             Prettier (both load code from node_modules and the repo) and uploads the result
#             as a binary git patch. Treat its output as untrusted.
#   push      contents: write + actions: write. Runs no repo or dependency code: only checkout,
#             download-artifact, bash, coreutils, grep, git and gh. Applies the patch, rejects it
#             unless every changed path is on the allow-list below and the lockfile content
#             passes the LOCK_* checks, commits, pushes to main, then dispatches ci and
#             security (pushes made with GITHUB_TOKEN don't trigger workflows; dispatches do).
# Both jobs only run for refs/heads/main, so dispatching from another branch does nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', 'packages/*/package.json', 'playground/package.json', 'pnpm-workspace.yaml', '.npmrc']
permissions:
  contents: read
concurrency:
  group: bootstrap-lockfile
  cancel-in-progress: false
# Allow-list for the patch (checked in the push job, tested in
# scripts/test/workflow-bootstrap-lockfile.test.mjs):
#   - pnpm-lock.yaml may be added or modified (regular file, mode 100644);
#   - any other path may only be MODIFIED (no add/delete/rename/mode change, mode 100644 on
#     both sides), must match FORMAT_PATHS (extensions Prettier formats here) and must NOT
#     match PROTECTED_PATHS: dot paths, scripts, tenants, e2e, manifests and tool config, and
#     every path that needs architect, dependency, security or richtext review in
#     scripts/review-gate.mjs (the test checks each tracked file and one sample per matrix glob,
#     so a new matrix path that this regex misses fails CI). A formatting change to a protected
#     file fails the run: format it in a reviewed PR instead (ci runs format:check on PRs).
#   - a path matching CODE_PATHS (anything that runs or renders as code) is never auto-pushed,
#     even when it is not protected: the run fails and the formatting goes in a reviewed PR (#177).
# Content of a patched pnpm-lock.yaml (#177). It is read as text with bash and grep, so it must
# first be in the plain style pnpm writes, where each line's indentation is its YAML ancestry:
#   - LOCK_FORM, tabs, CRs, backslashes, double quotes (pnpm writes single quotes), Unicode line
#     breaks, and {...}, [...] or single quotes that do not close on the same line are refused
#     (anchors, aliases, tags, merge keys, document markers, which a %directive needs, explicit
#     keys, block scalars with or without a comment, and multi-line values could otherwise hide
#     or move entries);
#   - every "tarball" must be part of a LOCK_TARBALL match (https://registry.npmjs.org/ only);
#   - every line matching LOCK_SPECIAL (a git, URL, file: or link: resolution or version, or a
#     jsr: specifier or @jsr/ name, which pnpm 10.9+ fetches from npm.jsr.io without writing a
#     tarball), keyed by the keys of its enclosing mappings, must already be in the base
#     lockfile. So existing workspace link: entries stay, and a new or moved one fails.
#     LOCK_DEPRECATED lines (a plain deprecation message, which may contain a URL) are exempt
#     from this and the quote check;
#   - no key may appear twice in one mapping, block or {...}, compared the way YAML reads keys,
#     no block line may start with [ or { (a flow collection as a key), and no plain key may
#     be one YAML reads as null, a boolean, a number or a timestamp (#223:
#     pnpm refuses such a lockfile, so frozen installs on main would fail);
#   - the dependency graph (#196, see the comment above the graph code in the push job): every
#     new or changed registry version must come from a package.json specifier that changed, an
#     existing name@version keeps its integrity, and a new npm alias must be in a package.json.
env:
  FORMAT_PATHS: '\.(md|json|jsonc|json5|yaml|yml|css|scss)$'
  CODE_PATHS: '\.(ts|tsx|mts|cts|js|jsx|mjs|cjs|astro|mdx|html|htm|vue|svelte)$'
  LOCK_TARBALL: '(^|[{ ,])tarball: https://registry\.npmjs\.org/[^ ,}]+'
  LOCK_SPECIAL: '(^|[^A-Za-z0-9_.-])(link|file|git|github|gitlab|bitbucket|gist|https?|ssh|jsr|git\+[a-z]+):|://|(^|[^A-Za-z0-9_.-])@jsr/|(^|[^A-Za-z0-9_.-])git@|(^|[ {,])(repo|commit|directory|path|type):'
  LOCK_FORM: '(^|[[{ ,])[&*!][^] ,}]|<<|^(---|\.\.\.)( |$)|^\?( |$)|(^|[ :-])[|>][-+0-9]*( +#.*)?$'
  LOCK_DEPRECATED: '^    deprecated: [^][{}&*!|>''"%@`#?-]'
  PROTECTED_PATHS: '(^|/)\.|^(scripts|tenants|e2e)/|^packages/(cli|functions|adapters|schema)/|^packages/core/src/richtext/|^packages/[^/]+/src/contracts/|(^|/)(package\.(json|yaml|json5)|pnpm-workspace\.yaml|turbo\.json|tsconfig[^/]*\.json|[^/]*\.config\.[^/]*)$|^(AGENTS|PROMPT|SECURITY)\.md$|^docs/(SECURITY|THREAT-MODEL|DECISIONS|DEPENDENCIES)\.md$|^docs/adr/|[Ss]anitiz|[Cc]sp|/headers/|Form'
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - id: check
        run: |
          if [ -f pnpm-lock.yaml ] && pnpm install --frozen-lockfile --lockfile-only --ignore-scripts >/dev/null 2>&1; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      # Errors are re-emitted as annotations so agents can read them via the check-runs API.
      - if: steps.check.outputs.stale == 'true'
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/install.log" || { tail -n 25 "$RUNNER_TEMP/install.log" | sed 's/^/::error title=pnpm install::/'; exit 1; }
          pnpm format 2>&1 | tee "$RUNNER_TEMP/format.log" || { tail -n 25 "$RUNNER_TEMP/format.log" | sed 's/^/::error title=prettier::/'; exit 1; }
      - id: patch
        if: steps.check.outputs.stale == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bootstrap-patch"
          git add -A
          git diff --cached --binary --no-renames HEAD > "$RUNNER_TEMP/bootstrap-patch/bootstrap.patch"
          if [ -s "$RUNNER_TEMP/bootstrap-patch/bootstrap.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to commit"
          fi
      - if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-patch
          path: ${{ runner.temp }}/bootstrap-patch/bootstrap.patch
          if-no-files-found: error
          retention-days: 1

  push:
    needs: generate
    if: github.ref == 'refs/heads/main' && needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-patch
          path: ${{ runner.temp }}/bootstrap-patch
      # Only git and bash from here on. The patch comes from a job that ran dependency code, so
      # git applies it (git refuses paths outside the work tree, inside .git or behind symlinks)
      # and the RESULT in the index is checked, not what the patch claims: first the paths, then
      # the content of pnpm-lock.yaml (#177, see LOCK_* above).
      - id: verify
        env:
          PATCH: ${{ runner.temp }}/bootstrap-patch/bootstrap.patch
        run: |
          set -euo pipefail
          size=$(stat -c %s "$PATCH")
          if [ "$size" -gt 52428800 ]; then echo "::error title=bootstrap-lockfile::patch is larger than 50 MB ($size bytes)"; exit 1; fi
          git apply --index --binary --whitespace=nowarn "$PATCH" || { echo "::error title=bootstrap-lockfile::patch does not apply to $(git rev-parse HEAD)"; exit 1; }
          bad=0
          while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
            read -r omode nmode _ _ status <<< "${meta#:}"
            if [ "$path" = pnpm-lock.yaml ] && [ "$nmode" = 100644 ] && { [ "$status" = M ] && [ "$omode" = 100644 ] || [ "$status" = A ]; }; then continue; fi
            if [[ "$path" =~ $CODE_PATHS ]]; then
              printf '::error title=bootstrap-lockfile::code file changed (status %s): %q. Code is never auto-pushed: run pnpm format and commit the result in a reviewed PR.\n' "$status" "$path"
              bad=1
              continue
            fi
            if [ "$status" = M ] && [ "$omode" = 100644 ] && [ "$nmode" = 100644 ] && [[ "$path" =~ $FORMAT_PATHS ]] && ! [[ "$path" =~ $PROTECTED_PATHS ]]; then continue; fi
            printf '::error title=bootstrap-lockfile::path outside the allow-list (status %s, mode %s -> %s): %q\n' "$status" "$omode" "$nmode" "$path"
            bad=1
          done < <(git diff --cached --raw -z --no-renames --no-abbrev HEAD)
          read -r lmode _ < <(git ls-files -s -- pnpm-lock.yaml) || lmode=
          if [ "$lmode" = 100644 ] && ! git diff --cached --quiet HEAD -- pnpm-lock.yaml; then
            export LC_ALL=C
            work=$(mktemp -d)
            git show :pnpm-lock.yaml > "$work/new"
            git show HEAD:pnpm-lock.yaml > "$work/base" 2> /dev/null || : > "$work/base"
            lockerr() {
              printf '::error file=pnpm-lock.yaml,line=%s,title=bootstrap-lockfile::%s\n' "$1" "$2"
              bad=1
            }
            # Duplicate keys (#223). pnpm refuses a lockfile with a key twice in one mapping
            # (ERR_PNPM_BROKEN_LOCKFILE), so a duplicate anywhere, in a block mapping or in a
            # {...}, would break frozen installs on main. Keys are compared the way YAML reads
            # them: quotes removed, '' unescaped, trailing spaces trimmed. A plain key that YAML
            # reads as null, a boolean, a number or a timestamp is refused, because its text is
            # not its key ("1.0" and "1.00" are the same key) and pnpm quotes such keys.
            YNONSTR='^(|~|null|Null|NULL|true|True|TRUE|false|False|FALSE|[-+]?(0b[01_]+|0o[0-7_]+|0x[0-9a-fA-F_]+|[0-9][0-9_]*(\.[0-9_]*)?([eE][-+]?[0-9]+)?)|\.[0-9_]+([eE][-+]?[0-9]+)?|[-+]?\.(inf|Inf|INF)|\.(nan|NaN|NAN)|[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt ].*)?)$'
            # ykey TEXT (a line without its indentation): YK=1 and YKEY=its block mapping key as
            # YAML reads it (YQ=1 if quoted), or YK=0 for a line that is not a key; YVAL is the
            # value after the key, or the item after "- ", or the line itself.
            ykey() {
              local s=$1 i c
              YK=0 YQ=0 YKEY= YVAL=$1
              case "$s" in
                '-') YVAL= ; return 0 ;;
                '- '*) YVAL=${s#- } ; return 0 ;;
                [\{\[]*) return 0 ;;
                \'*)
                  YQ=1 i=1
                  while [ "$i" -lt "${#s}" ]; do
                    c=${s:i:1}
                    if [ "$c" = "'" ]; then
                      if [ "${s:i+1:1}" != "'" ]; then break; fi
                      i=$((i + 1))
                    fi
                    YKEY+=$c i=$((i + 1))
                  done
                  s=${s:i+1}
                  s=${s#"${s%%[! ]*}"}
                  case "$s" in
                    :) YK=1 YVAL= ;;
                    ': '*) YK=1 YVAL=${s#: } ;;
                    *) YKEY= YQ=0 ;;
                  esac
                  ;;
                *': '*) YK=1 YKEY=${s%%: *} YVAL=${s#*: } ;;
                *:) YK=1 YKEY=${s%:} YVAL= ;;
              esac
              YKEY=${YKEY%"${YKEY##*[! ]}"}
              YVAL=${YVAL#"${YVAL%%[! ]*}"}
              return 0
            }
            # flowdup TEXT LINE: reports a key that is twice in one {...} of TEXT (a flow value),
            # and a plain key in one that YAML reads as another type.
            flowdup() {
              local s=$1 i c nx k q=0 tq=0 tok= US=$'\x1f'
              local -a ty=() ks=() st=()
              for ((i = 0; i < ${#s}; i++)); do
                c=${s:i:1}
                if [ "$q" = 1 ]; then
                  if [ "$c" = "'" ]; then
                    if [ "${s:i+1:1}" = "'" ]; then tok+="'" i=$((i + 1)); else q=0; fi
                  else
                    tok+=$c
                  fi
                  continue
                fi
                case "$c" in
                  "'") q=1 tq=1 ;;
                  '{' | '[') ty+=("$c") ks+=("$US") st+=(0) tok= tq=0 ;;
                  : | , | '}' | ']')
                    if [ "${#ty[@]}" = 0 ]; then tok+=$c; continue; fi
                    if [ "$c" = : ]; then
                      nx=${s:i+1:1}
                      if [ "${ty[-1]}" != '{' ] || [ "${st[-1]}" = 1 ]; then tok+=$c; continue; fi
                      case "$tq$nx" in 1* | 0 | '0 ' | 0, | '0}' | '0]') ;; *) tok+=$c; continue ;; esac
                    fi
                    if [ "${ty[-1]}" = '{' ] && [ "${st[-1]}" = 0 ] && { [ "$c" = : ] || [ "$tq" = 1 ] || [[ "$tok" == *[!\ ]* ]]; }; then
                      k=${tok#"${tok%%[! ]*}"}
                      k=${k%"${k##*[! ]}"}
                      if [ "$tq" = 0 ] && [[ "$k" =~ $YNONSTR ]]; then lockerr "$2" "key '$k' in {...}: YAML reads it as null, a boolean, a number or a timestamp, and pnpm quotes such keys. Commit this lockfile change in a reviewed PR."; fi
                      if [[ "${ks[-1]}" == *"$US$k$US"* ]]; then lockerr "$2" "duplicate key '$k' in {...}: pnpm refuses a lockfile with a duplicated mapping key. Commit this lockfile change in a reviewed PR."; fi
                      ks[-1]+="$k$US"
                    fi
                    case "$c" in
                      :) st[-1]=1 ;;
                      ,) st[-1]=0 ;;
                      *) unset 'ty[-1]' 'ks[-1]' 'st[-1]' ;;
                    esac
                    tok= tq=0
                    ;;
                  *) tok+=$c ;;
                esac
              done
            }
            # scan FILE OUT CHECK: writes "ancestry<RS>line" to OUT for every git, URL, file: or
            # link: line (LOCK_SPECIAL), where ancestry is the keys of the enclosing mappings, so
            # an entry that exists in the base cannot be moved to another importer or package.
            # With CHECK=1 it also reports every line that breaks the LOCK_* form rules and every
            # duplicate key (#223).
            scan() {
              local line t s n=0 ind o c p ys yc IFS=$'\x1f'
              local -a ki=() kk=() di=() dk=()
              local -A dseen=()
              : > "$2"
              while IFS= read -r line || [ -n "$line" ]; do
                n=$((n + 1))
                t="${line#"${line%%[! ]*}"}"
                ind=$((${#line} - ${#t}))
                # Blank and comment lines do not end a mapping.
                case "$t" in
                  '' | '#'*) ;;
                  *) while [ "${#ki[@]}" -gt 0 ] && [ "${ki[-1]}" -ge "$ind" ]; do unset 'ki[-1]' 'kk[-1]'; done ;;
                esac
                s="$t"
                while [[ "$s" =~ $LOCK_TARBALL ]]; do s="${s/"${BASH_REMATCH[0]}"/ }"; done
                if [ "$3" = 1 ]; then
                  case "$line" in
                    *$'\t'* | *$'\r'* | *\\* | *$'\xc2\x85'* | *$'\xe2\x80\xa8'* | *$'\xe2\x80\xa9'*)
                      lockerr "$n" "tab, carriage return, backslash escape or Unicode line break: pnpm does not write these" ;;
                  esac
                  if [[ "$t" =~ $LOCK_FORM ]]; then lockerr "$n" "YAML anchor, alias, tag, merge key, document marker, explicit key or block scalar: pnpm does not write these"; fi
                  o="${t//[^\{]/}" c="${t//[^\}]/}"
                  if [ "${#o}" != "${#c}" ]; then lockerr "$n" "flow mapping spans lines: pnpm writes each {...} on one line"; fi
                  o="${t//[!\[]/}" c="${t//[!\]]/}"
                  if [ "${#o}" != "${#c}" ]; then lockerr "$n" "flow sequence spans lines: pnpm writes each [...] on one line"; fi
                  if [[ "$s" == *tarball* ]]; then lockerr "$n" "tarball is not on https://registry.npmjs.org/: $t. Commit this lockfile change in a reviewed PR."; fi
                  if ! [[ "$line" =~ $LOCK_DEPRECATED ]]; then
                    # With one quote character only, a line that opens an unclosed quoted value
                    # always has an odd count of it, whatever else it contains.
                    case "$t" in *'"'*) lockerr "$n" "double quote: pnpm writes single quotes" ;; esac
                    o="${t//[^\']/}"
                    if [ $((${#o} % 2)) != 0 ]; then lockerr "$n" "quoted value spans lines: pnpm writes each quoted value on one line"; fi
                  fi
                  # #223: the path of a block key is the keys of its enclosing mappings.
                  case "$t" in
                    '' | '#'*) ;;
                    *)
                      while [ "${#di[@]}" -gt 0 ] && [ "${di[-1]}" -ge "$ind" ]; do unset 'di[-1]' 'dk[-1]'; done
                      ykey "$t"
                      # A "- " item opens a new mapping at the column of its content, so each
                      # item has its own path (pnpm writes no mappings in lists).
                      ys=$t yc=$ind
                      while [ "$YK" = 0 ] && [[ "$ys" == '- '* ]]; do
                        o=${ys#- }
                        o=${o#"${o%%[! ]*}"}
                        di+=("$yc") dk+=($'\x1d'"$n")
                        yc=$((yc + ${#ys} - ${#o})) ys=$o
                        ykey "$ys"
                      done
                      # A block line that starts with [ or {, even after "- ", is a flow
                      # collection used as a key ("[ms]: x"), which YAML turns into a string such
                      # as "ms" or "[object Object]". pnpm writes no such line (security-45).
                      case "$ys" in
                        [\{\[]*) lockerr "$n" "line that starts with [ or {: YAML reads a flow collection there as a key, and pnpm writes none. Commit this lockfile change in a reviewed PR." ;;
                      esac
                      # Both of these only over-refuse, on lines pnpm never writes: bare "-" items
                      # with the mapping on the next line share one path, and a quoted key with a
                      # trailing space ('a ') is compared as a.
                      if [ "$YK" = 1 ]; then
                        if [ "$YQ" = 0 ] && [[ "$YKEY" =~ $YNONSTR ]]; then
                          lockerr "$n" "key '$YKEY': YAML reads it as null, a boolean, a number or a timestamp, and pnpm quotes such keys. Commit this lockfile change in a reviewed PR."
                        fi
                        p="${dk[*]}"$'\x1f'"$YKEY"
                        if [ -n "${dseen[$p]-}" ]; then
                          o=${dk[*]}
                          o=${o//$'\x1d'/the list item on line }
                          lockerr "$n" "duplicate key $YKEY${dk[0]+ under ${o//"$IFS"/ > }}: pnpm refuses a lockfile with a duplicated mapping key. Commit this lockfile change in a reviewed PR."
                        fi
                        dseen[$p]=1
                        di+=("$yc") dk+=("$YKEY")
                      fi
                      case "$YVAL" in [\{\[]*) flowdup "$YVAL" "$n" ;; esac
                      ;;
                  esac
                fi
                if ! [[ "$line" =~ $LOCK_DEPRECATED ]] && [[ "$s" =~ $LOCK_SPECIAL ]]; then printf '%s\x1e%s\n' "${kk[*]}" "$t" >> "$2"; fi
                case "$t" in
                  '' | '#'* | -*) ;;
                  *:) ki+=("$ind") kk+=("${t%:}") ;;
                  *': '*) ki+=("$ind") kk+=("${t%%: *}") ;;
                esac
              done < "$1"
            }
            scan "$work/base" "$work/base.special" 0
            scan "$work/new" "$work/new.special" 1
            while IFS=$'\x1e' read -r ctx t; do
              ln=$(grep -nFm1 -- "$t" "$work/new" | cut -d: -f1 || true)
              lockerr "${ln:-1}" "git, URL, file:, link: or JSR entry that the base lockfile does not have (under ${ctx//$'\x1f'/ > }): $t. Commit this lockfile change in a reviewed PR."
            done < <(grep -Fxv -f "$work/base.special" "$work/new.special" || true)
            # Dependency graph (#196, #217). The base lockfile matched the package.json files at its
            # commit, so every change must come from a package.json specifier that changed since.
            # The lockfile is read the way pnpm reads it: a snapshots key is ID followed by balanced
            # "(...)" peer groups and an ID is name@version (pnpm's removeSuffix), and a ref with an
            # "@" before its first "(" is an npm alias (pnpm's refToRelative). The rules:
            #   R7 top-level keys are lockfileVersion, settings, overrides, importers, packages and
            #      snapshots only; lockfileVersion and settings may not change. overrides may: a
            #      frozen install (ci) fails unless it matches the reviewed pnpm-workspace.yaml;
            #   R6 an importer may only change its dependency entries: a root (a changed specifier
            #      that is in the importer's package.json at HEAD, pinning an exact version or
            #      npm:name@version that its version matches), a peer-suffix-only change to an entry
            #      the base lockfile already has, or a removal of a name package.json no longer lists;
            #   R4/R5 an existing name@version is never new territory: a new snapshots entry whose ID
            #      is in the base packages is a new peer variant and fails (peer variants of existing
            #      packages go in a reviewed PR). Every other new snapshots entry must be reachable
            #      from a root through new entries, whose dependencies must be registry versions
            #      (so a new npm alias fails);
            #   R2 snapshots and packages entries only have the fields pnpm writes for registry
            #      packages, and a new packages entry's resolution is exactly {integrity: sha512-...}
            #      (no tarball), for an ID that a new snapshots entry reached;
            #   R3 every snapshots key has a packages entry, and every dependency and importer
            #      version points at a snapshots entry;
            #   existing packages entries (so their integrity) may not change, and existing
            #   snapshots entries only in their "optional: true" line.
            # The parser reads the plain layout pnpm writes (two-space indents, no comments, one
            # key per line, no duplicate keys); anything else in the new lockfile fails the run.
            US=$'\x1f' RS=$'\x1e'
            NAME='(@[A-Za-z0-9][A-Za-z0-9._~-]*/)?[A-Za-z0-9][A-Za-z0-9._~-]*'
            VER='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'
            EXACT="^$VER\$"
            ALIAS="^$NAME@$VER\$"
            IDRE="^$NAME@$VER\$"
            IDPRE="^$NAME@$VER"
            VERPRE="^$VER"
            NAMERE="^$NAME\$"
            SUFCHARS='^[A-Za-z0-9@/._~+()-]*$'
            KEYCHARS='^[A-Za-z0-9@/._()+~=:#-]+$'
            IMPORTER='^[A-Za-z0-9_@][A-Za-z0-9_.@/-]*$'
            TOPKEY='^[A-Za-z]+$'
            NPMP='npm:'
            INTEGRITY='^\{integrity: sha512-[A-Za-z0-9+/]+=*\}$'
            unq() {
              REPLY=$1
              if [ "${#REPLY}" -ge 2 ] && [[ "$REPLY" == \'*\' ]]; then REPLY=${REPLY:1:-1} REPLY=${REPLY//"''"/"'"}; fi
              return 0
            }
            # suffixok TEXT: TEXT is zero or more balanced "(...)" groups, nothing between or after.
            suffixok() {
              local s=$1 i c d=0
              if ! [[ "$s" =~ $SUFCHARS ]]; then return 1; fi
              for ((i = 0; i < ${#s}; i++)); do
                c=${s:i:1}
                if [ "$c" = '(' ]; then
                  d=$((d + 1))
                elif [ "$c" = ')' ]; then
                  d=$((d - 1))
                  if [ "$d" -lt 0 ]; then return 1; fi
                elif [ "$d" = 0 ]; then
                  return 1
                fi
              done
              [ "$d" = 0 ]
            }
            # keyok KIND KEY: a packages key is an ID, a snapshots key an ID and peer groups.
            keyok() {
              if [ "$1" = packages ]; then [[ "$2" =~ $IDRE ]]; return; fi
              if ! [[ "$2" =~ $IDPRE ]]; then return 1; fi
              suffixok "${2:${#BASH_REMATCH[0]}}"
            }
            # refkey NAME REF: sets REPLY to the snapshots key that dependency NAME: REF points at
            # and RALIAS to 1 for an npm alias (name@version...), 0 for a version; fails for any
            # other ref (link:, file:, git, junk).
            refkey() {
              local pre=${2%%(*}
              if [[ "$2" == @* ]] || [[ "$pre" == *@* ]]; then
                if ! [[ "$2" =~ $IDPRE ]] || ! suffixok "${2:${#BASH_REMATCH[0]}}"; then return 1; fi
                REPLY=$2 RALIAS=1
              else
                if ! [[ "$2" =~ $VERPRE ]] || ! suffixok "${2:${#BASH_REMATCH[0]}}"; then return 1; fi
                REPLY="$1@$2" RALIAS=0
              fi
            }
            edgelist() {
              local IFS=$RS
              # KEYCHARS already keeps glob characters out of new refs; this is a safeguard.
              set -f
              EDGES=($1)
              set +f
            }
            # graph FILE P REPORT: reads the lockfile into P_top (top-level key -> section text),
            # P_spec and P_ver (importer US section US name -> value), P_imps (importer -> 1),
            # P_iother (importer -> text outside its dependency entries), P_pkg and P_snap (key ->
            # block text), P_edges (key -> name US ref RS ...) and P_line. REPORT=1 reports every
            # line outside the plain layout and every field pnpm does not write.
            graph() {
              local -n tops="$2_top" spec="$2_spec" ver="$2_ver" imps="$2_imps" iother="$2_iother" pkg="$2_pkg" snap="$2_snap" edges="$2_edges" at="$2_line"
              local line t ind k v dn n=0 top= key= imp= sect= id= deps=0 isdep=0 msg
              local -A seen=()
              while IFS= read -r line || [ -n "$line" ]; do
                n=$((n + 1))
                t="${line#"${line%%[! ]*}"}"
                ind=$((${#line} - ${#t}))
                if [ -z "$t" ]; then continue; fi
                msg=
                if ! [[ "$line" =~ $LOCK_DEPRECATED ]]; then
                  case "$t" in '#'* | *' #'*) msg="comment: pnpm does not write comments" ;; esac
                  if [ $((ind % 2)) != 0 ]; then msg="odd indentation: pnpm indents by two spaces"; fi
                fi
                case "$t" in
                  *:) k=${t%:} v= ;;
                  *': '*) k=${t%%: *} v=${t#*: } ;;
                  *) k= v=$t ;;
                esac
                if [ "$ind" = 0 ]; then top=$k key= imp= sect= id= deps=0 isdep=0; fi
                if [ -n "$top" ]; then tops[$top]+="$line$US"; fi
                if [ -n "$msg" ]; then
                  :
                elif [ "$ind" = 0 ]; then
                  if ! [[ "$k" =~ $TOPKEY ]]; then
                    msg="top-level line that is not a key: pnpm writes none"
                  elif [ -n "${seen[t$US$k]-}" ]; then
                    msg="duplicate top-level key $k"
                  fi
                  seen[t$US$k]=1 at[t$US$k]=$n
                elif [ "$top" = importers ]; then
                  case "$ind" in
                    2)
                      unq "$k"
                      imp=$REPLY sect= id= isdep=0
                      if [ -z "$k" ] || { [ -n "$v" ] && [ "$v" != '{}' ]; }; then msg="importer that is not 'path:' or 'path: {}'"
                      elif [ -n "${seen[m$US$imp]-}" ]; then msg="duplicate importer $imp"; fi
                      seen[m$US$imp]=1 imps[$imp]=1
                      ;;
                    4)
                      sect=$k id=
                      case "$k" in
                        dependencies | devDependencies | optionalDependencies)
                          isdep=1
                          if [ -n "$v" ]; then msg="flow-style $k in importer $imp: pnpm writes one entry per line"; fi
                          ;;
                        *) isdep=0 iother[$imp]+="$line$US" ;;
                      esac
                      ;;
                    6)
                      if [ "$isdep" = 1 ]; then
                        unq "$k"
                        id="$imp$US$sect$US$REPLY"
                        if [ -z "$k" ] || [ -n "$v" ]; then msg="importer entry that is not 'name:'"
                        elif [ -n "${seen[i$US$id]-}" ]; then msg="duplicate importer entry $REPLY"; fi
                        seen[i$US$id]=1 at[i$US$id]=$n
                      else
                        iother[$imp]+="$line$US"
                      fi
                      ;;
                    8)
                      if [ "$isdep" = 0 ]; then
                        iother[$imp]+="$line$US"
                      elif [ -n "$id" ] && { [ "$k" = specifier ] || [ "$k" = version ]; }; then
                        if [ -n "${seen[i$US$id$US$k]-}" ]; then msg="duplicate $k"; fi
                        seen[i$US$id$US$k]=1
                        unq "$v"
                        if [ "$k" = specifier ]; then spec[$id]=$REPLY; else ver[$id]=$REPLY; fi
                      else
                        msg="importer entry field ${k:-$v} that is not specifier or version"
                      fi
                      ;;
                    *)
                      if [ "$isdep" = 1 ]; then msg="nested value in importer entry"; else iother[$imp]+="$line$US"; fi
                      ;;
                  esac
                elif [ "$top" = packages ] || [ "$top" = snapshots ]; then
                  if [ "$ind" = 2 ]; then
                    unq "$k"
                    key=$REPLY deps=0
                    if [ -z "$k" ] || { [ -n "$v" ] && [ "$v" != '{}' ]; }; then
                      msg="$top entry that is not 'key:' or 'key: {}'"
                    elif ! keyok "$top" "$key"; then
                      if [ "$top" = packages ]; then
                        msg="packages key $key is not name@version"
                      else
                        msg="snapshots key $key is not name@version followed by balanced (...) groups"
                      fi
                    elif [ -n "${seen[$top$US$key]-}" ]; then
                      msg="duplicate $top entry $key"
                    fi
                    seen[$top$US$key]=1 at[$top$US$key]=$n
                    # "key: {}" and "key:" with no lines under it are the same empty mapping.
                    if [ "$top" = packages ]; then pkg[$key]=$US; else snap[$key]=$US; fi
                  elif [ -z "$key" ] || [ "$ind" -lt 2 ]; then
                    msg="line outside a $top entry"
                  elif [ "$top" = packages ]; then
                    pkg[$key]+="$line$US"
                    if [ "$ind" = 4 ]; then
                      case "$k" in
                        resolution | engines | cpu | os | libc | hasBin | deprecated | peerDependencies | peerDependenciesMeta | bundledDependencies) ;;
                        *) msg="packages field ${k:-$v} of $key: pnpm writes no such field for a registry package" ;;
                      esac
                    fi
                  else
                    snap[$key]+="$line$US"
                    if [ "$ind" = 4 ]; then
                      case "$k" in
                        dependencies | optionalDependencies) deps=1 ;;
                        transitivePeerDependencies | optional) deps=0 ;;
                        *) deps=0 msg="snapshots field ${k:-$v} of $key: pnpm reads it as the package's own, so it may only come from the packages entry" ;;
                      esac
                      if [ "$deps" = 1 ] && [ -n "$v" ]; then msg="flow-style $k: pnpm writes one dependency per line"; fi
                    elif [ "$deps" = 1 ] && [ "$ind" = 6 ]; then
                      unq "$k"
                      dn=$REPLY
                      unq "$v"
                      if [ -z "$k" ] || [ -z "$v" ] || ! [[ "$dn" =~ $NAMERE ]] || ! [[ "$REPLY" =~ $KEYCHARS ]]; then
                        msg="dependency of $key that is not 'name: version'"
                      elif [ -n "${seen[e$US$key$US$dn]-}" ]; then
                        msg="duplicate dependency $dn of $key"
                      fi
                      seen[e$US$key$US$dn]=1
                      edges[$key]+="$dn$US$REPLY$RS"
                    elif [ "$deps" = 1 ]; then
                      msg="nested value under the dependencies of $key"
                    fi
                  fi
                fi
                if [ -n "$msg" ] && [ "$3" = 1 ]; then lockerr "$n" "$msg. Commit this lockfile change in a reviewed PR."; fi
              done < "$1"
              return 0
            }
            # pjsection SECTION NAME: prints the value of "NAME" in SECTION of the package.json on
            # stdin (in the layout Prettier writes), or fails if it has no such entry.
            pjsection() {
              local l in=0 want="    \"$2\": \""
              while IFS= read -r l; do
                if [ "$in" = 0 ]; then
                  if [ "$l" = "  \"$1\": {" ]; then in=1; fi
                else
                  case "$l" in
                    "$want"*)
                      l=${l#"$want"}
                      l=${l%,}
                      if [[ "$l" == *\" ]]; then REPLY=${l%\"}; return 0; fi
                      ;;
                    '  }' | '  },') in=0 ;;
                  esac
                fi
              done
              return 1
            }
            # pjpath IMPORTER: sets REPLY to the importer's package.json path, or fails.
            pjpath() {
              if [ "$1" = . ]; then
                REPLY=package.json
              elif [[ "$1" =~ $IMPORTER ]] && [[ "/$1/" != */../* ]] && [[ "/$1/" != */./* ]]; then
                REPLY="$1/package.json"
              else
                return 1
              fi
            }
            declare -A base_top=() base_spec=() base_ver=() base_imps=() base_iother=() base_pkg=() base_snap=() base_edges=() base_line=()
            declare -A new_top=() new_spec=() new_ver=() new_imps=() new_iother=() new_pkg=() new_snap=() new_edges=() new_line=()
            graph "$work/base" base 0
            graph "$work/new" new 1
            # R7: top-level keys.
            for k in "${!new_top[@]}"; do
              case "$k" in
                lockfileVersion | settings | overrides | importers | packages | snapshots) ;;
                *) lockerr "${new_line[t$US$k]-1}" "top-level key $k: the push job only accepts lockfileVersion, settings, overrides, importers, packages and snapshots. Commit this lockfile change in a reviewed PR." ;;
              esac
            done
            for k in lockfileVersion settings; do
              if [ "${base_top[$k]-}" != "${new_top[$k]-}" ]; then
                lockerr "${new_line[t$US$k]-1}" "$k differs from the base lockfile. Commit this lockfile change in a reviewed PR."
              fi
            done
            # R6: importers outside their dependency entries.
            declare -A allimps=()
            for imp in "${!base_imps[@]}" "${!new_imps[@]}"; do allimps[$imp]=1; done
            for imp in "${!allimps[@]}"; do
              if [ "${base_iother[$imp]-}" != "${new_iother[$imp]-}" ]; then
                lockerr 1 "importer $imp changed outside its dependencies, devDependencies and optionalDependencies. Commit this lockfile change in a reviewed PR."
              fi
            done
            # R6: removed importer entries.
            for id in "${!base_ver[@]}"; do
              if [ -n "${new_ver[$id]+x}" ]; then continue; fi
              imp=${id%%"$US"*} rest=${id#*"$US"}
              sect=${rest%%"$US"*} name=${rest#*"$US"}
              if ! pjpath "$imp"; then continue; fi
              pjtext=$(git show "HEAD:$REPLY" 2> /dev/null) || continue
              if pjsection "$sect" "$name" <<< "$pjtext"; then
                lockerr 1 "$name was removed from the $sect of importer $imp, but its package.json still lists it. Commit this lockfile change in a reviewed PR."
              fi
            done
            # R6, roots: importer entries whose specifier changed.
            roots=()
            for id in "${!new_ver[@]}"; do
              imp=${id%%"$US"*} rest=${id#*"$US"}
              sect=${rest%%"$US"*} name=${rest#*"$US"}
              s=${new_spec[$id]-} v=${new_ver[$id]} ln=${new_line[i$US$id]}
              # Workspace links are checked by the LOCK_SPECIAL rule above.
              case "$v" in link:*) continue ;; esac
              if ! refkey "$name" "$v"; then
                lockerr "$ln" "$name: version $v in importer $imp is not a registry version or npm alias. Commit this lockfile change in a reviewed PR."
                continue
              fi
              t=$REPLY
              # R3: every importer version points at a snapshots entry.
              if [ -z "${new_snap[$t]+x}" ]; then lockerr "$ln" "no snapshots entry for $t. Commit this lockfile change in a reviewed PR."; fi
              if [ -n "${base_ver[$id]+x}" ] && [ "${base_ver[$id]}" = "$v" ] && [ "${base_spec[$id]-}" = "$s" ]; then continue; fi
              if [ -n "${base_ver[$id]+x}" ] && [ "${base_spec[$id]-}" = "$s" ]; then
                o=
                if refkey "$name" "${base_ver[$id]}"; then o=$REPLY; fi
                if [ "${o%%(*}" != "${t%%(*}" ]; then
                  lockerr "$ln" "$name in importer $imp changed from ${base_ver[$id]} to $v, but its specifier $s did not change. Commit this lockfile change in a reviewed PR."
                elif [ -z "${base_snap[$t]+x}" ]; then
                  lockerr "$ln" "$name in importer $imp moved to the new peer variant $t: peer variants of existing packages are not auto-pushed. Commit this lockfile change in a reviewed PR."
                fi
                continue
              fi
              if ! pjpath "$imp"; then
                lockerr "$ln" "importer $imp is not a plain relative path"
                continue
              fi
              pj=$REPLY
              pjtext=$(git show "HEAD:$pj" 2> /dev/null) || pjtext=
              if ! pjsection "$sect" "$name" <<< "$pjtext" || [ "$REPLY" != "$s" ]; then
                lockerr "$ln" "$name: $s in importer $imp is not in the $sect of $pj at HEAD. Commit this lockfile change in a reviewed PR."
                continue
              fi
              if [[ "$s" =~ $EXACT ]] && [ "$RALIAS" = 0 ]; then
                want="$name@$s"
              elif [[ "$s" == "$NPMP"* ]] && [[ "${s#"$NPMP"}" =~ $ALIAS ]] && [ "$RALIAS" = 1 ]; then
                want=${s#"$NPMP"}
              elif [[ "$s" =~ $EXACT ]] || [[ "$s" == "$NPMP"* && "${s#"$NPMP"}" =~ $ALIAS ]]; then
                lockerr "$ln" "$name: version $v in importer $imp does not match its specifier $s. Commit this lockfile change in a reviewed PR."
                continue
              else
                lockerr "$ln" "$name: specifier $s in importer $imp is not an exact version or npm:name@version (docs/DEPENDENCIES.md pins exactly). Commit this lockfile change in a reviewed PR."
                continue
              fi
              if [ "${t%%(*}" != "$want" ]; then
                lockerr "$ln" "$name: version $v in importer $imp does not match its specifier $s. Commit this lockfile change in a reviewed PR."
                continue
              fi
              roots+=("$t")
            done
            # R4: everything reachable from the roots through new name@versions. A key whose ID
            # is in the base packages is not walked: it is an existing entry (which may not
            # change) or a new peer variant of one (which fails below).
            declare -A reach=()
            i=0
            while [ "$i" -lt "${#roots[@]}" ]; do
              k=${roots[$i]} i=$((i + 1))
              s=${k%%(*}
              if [ -n "${reach[$k]-}" ] || [ -z "${new_snap[$k]+x}" ] || [ -n "${base_pkg[$s]+x}" ]; then continue; fi
              reach[$k]=1
              edgelist "${new_edges[$k]-}"
              for e in "${EDGES[@]}"; do
                n=${e%%"$US"*} r=${e#*"$US"}
                if refkey "$n" "$r" && [ "$RALIAS" = 0 ]; then
                  roots+=("$REPLY")
                else
                  lockerr "${new_line[snapshots$US$k]}" "new snapshots entry $k depends on $n: $r, an npm alias or not a registry version. An alias must come from a package.json specifier: commit this lockfile change in a reviewed PR."
                fi
              done
            done
            for k in "${!new_snap[@]}"; do
              ln=${new_line[snapshots$US$k]} id=${k%%(*}
              # R3: a packages entry for every snapshots key, a snapshots entry for every dependency.
              if [ -z "${new_pkg[$id]+x}" ]; then lockerr "$ln" "snapshots entry $k has no packages entry $id. Commit this lockfile change in a reviewed PR."; fi
              edgelist "${new_edges[$k]-}"
              for e in "${EDGES[@]}"; do
                n=${e%%"$US"*} r=${e#*"$US"}
                case "$r" in link:*) continue ;; esac
                if refkey "$n" "$r" && [ -z "${new_snap[$REPLY]+x}" ]; then
                  lockerr "$ln" "$k depends on $n: $r, which has no snapshots entry. Commit this lockfile change in a reviewed PR."
                fi
              done
              if [ -n "${base_snap[$k]+x}" ]; then
                o=${base_snap[$k]//"$US    optional: true$US"/$US} c=${new_snap[$k]//"$US    optional: true$US"/$US}
                if [ "$o" != "$c" ]; then
                  lockerr "$ln" "snapshots entry $k changed, although its key did not. Commit this lockfile change in a reviewed PR."
                fi
              elif [ -n "${base_pkg[$id]+x}" ]; then
                lockerr "$ln" "new snapshots entry $k is a new peer variant of $id, which the base lockfile already has: peer variants of existing packages are not auto-pushed. Commit this lockfile change in a reviewed PR."
              elif [ -z "${reach[$k]-}" ]; then
                lockerr "$ln" "new snapshots entry $k is not reachable from a dependency whose specifier changed in a package.json. Commit this lockfile change in a reviewed PR."
              fi
            done
            declare -A rpkg=()
            for k in "${!reach[@]}"; do
              s=${k%%(*}
              rpkg[$s]=1
            done
            for k in "${!new_pkg[@]}"; do
              ln=${new_line[packages$US$k]}
              if [ -n "${base_pkg[$k]+x}" ]; then
                if [ "${base_pkg[$k]}" != "${new_pkg[$k]}" ]; then
                  o=${base_pkg[$k]#*"$US    resolution: "} c=${new_pkg[$k]#*"$US    resolution: "}
                  if [ "${o%%"$US"*}" != "${c%%"$US"*}" ]; then
                    lockerr "$ln" "integrity or resolution of $k changed, although its name and version did not. Commit this lockfile change in a reviewed PR."
                  else
                    lockerr "$ln" "packages entry $k changed, although its name and version did not. Commit this lockfile change in a reviewed PR."
                  fi
                fi
              else
                if [ -z "${rpkg[$k]-}" ]; then
                  lockerr "$ln" "new packages entry $k is not reachable from a dependency whose specifier changed in a package.json. Commit this lockfile change in a reviewed PR."
                fi
                c=${new_pkg[$k]#*"$US    resolution: "}
                if [ "$c" = "${new_pkg[$k]}" ] || ! [[ "${c%%"$US"*}" =~ $INTEGRITY ]]; then
                  lockerr "$ln" "new packages entry $k: its resolution must be exactly {integrity: sha512-...}, with no tarball. Commit this lockfile change in a reviewed PR."
                fi
              fi
            done
            rm -rf -- "$work"
          fi
          if [ "$bad" != 0 ]; then echo "::error title=bootstrap-lockfile::patch rejected. Make these changes in a reviewed PR, then re-run."; exit 1; fi
          git diff --cached --stat HEAD
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet HEAD; then echo "nothing to commit"; exit 0; fi
          git -c core.hooksPath=/dev/null commit -m "chore: regenerate pnpm-lock.yaml and apply prettier" -m "Agent: bootstrap-lockfile workflow"
          # The token is only used here, on the command line, never written to .git/config.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main
          gh workflow run ci.yml --ref main
          gh workflow run security.yml --ref main
