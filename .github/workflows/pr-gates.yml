name: pr-gates
# The gate scripts run from the PR's BASE commit, never from the PR's own checkout (#84).
# A PR that edits scripts/review-gate.mjs or scripts/touches-guard.mjs is therefore judged by
# the gate already on the base branch, not by its own edited copy. The scripts read the PR's
# files, labels, body and commits only through the GitHub API, so the PR head is never checked
# out and no PR code runs here. Trigger stays `pull_request` (never `pull_request_target`), and
# the token is read-only.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gate scripts from the PR's base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-gate
          persist-credentials: false
          sparse-checkout: |
            scripts
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version-file: base-gate/.nvmrc }
      - name: review-gate (base copy)
        working-directory: base-gate
        run: node scripts/review-gate.mjs "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  touches-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gate scripts from the PR's base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-gate
          persist-credentials: false
          sparse-checkout: |
            scripts
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version-file: base-gate/.nvmrc }
      - name: touches-guard (base copy)
        working-directory: base-gate
        run: node scripts/touches-guard.mjs "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  path-aliases:
    # #190: refuse PR paths that macOS or Windows open as another path (case, a trailing dot
    # or space, NFC/NFD, ignorable code points). The paths come from the trees API for the PR
    # head, so the PR is still never checked out, and the check is the base commit's copy.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gate scripts from the PR's base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-gate
          persist-credentials: false
          sparse-checkout: |
            scripts
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version-file: base-gate/.nvmrc }
      - name: check-path-aliases (base copy)
        working-directory: base-gate
        run: node scripts/check-path-aliases.mjs --tree "$HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
