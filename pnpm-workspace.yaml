packages:
  - packages/*
  - playground
# tenants/ is deliberately NOT a workspace: tenants are data only (PROMPT.md §6).

# Phantom dependencies (#222): a package may load only what it declares.
# Pinned by scripts/*.test.mjs; do not add entries without a security review.
hoistPattern: []
publicHoistPattern: []

# Dependency build scripts are blocked unless listed here (pnpm 10 default).
onlyBuiltDependencies: []

# Security overrides: force patched transitive versions. Remove when upstream ranges include the fix.
overrides:
  tinypool: 2.1.2 # CVE-2026-104848 (<=2.1.0), CVE-2026-104849 (<2.1.2): prototype pollution → RCE
